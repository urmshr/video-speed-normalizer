<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="extName">Video Speed Normalizer</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="keywords-section">
      <label data-i18n="keywordsListLabel">Keywords</label>
      <div class="help-text" data-i18n="keywordsHelp"></div>
      <div class="tags-container">
        <div class="tags-list" id="tagsList"></div>
        <div class="tags-actions">
          <button class="add-btn" id="addTagBtn" data-i18n="addKeywordButton">
            Add keyword
          </button>
          <form id="addTagForm" class="hidden">
            <input type="text" class="tag-input" id="tagInput" />
          </form>
          <button
            class="reset-link"
            id="resetKeywords"
            type="button"
            data-i18n="resetKeywordsButton"
          >
            Reset
          </button>
        </div>
      </div>
    </div>

    <div class="keywords-section">
      <label data-i18n="excludeKeywordsListLabel">Exclude Keywords</label>
      <div class="help-text" data-i18n="excludeKeywordsHelp"></div>
      <div class="tags-container">
        <div class="tags-list" id="excludeTagsList"></div>
        <div class="tags-actions">
          <button
            class="add-btn"
            id="addExcludeTagBtn"
            data-i18n="addExcludeKeywordButton"
          >
            Add exclude keyword
          </button>
          <form id="addExcludeTagForm" class="hidden">
            <input type="text" class="tag-input" id="excludeTagInput" />
          </form>
          <button
            class="reset-link"
            id="resetExcludeKeywords"
            type="button"
            data-i18n="clearExcludeKeywordsButton"
          >
            Clear
          </button>
        </div>
      </div>
    </div>

    <div class="settings-section">
      <label class="checkbox-label">
        <input type="checkbox" id="enableOfficialArtistMatch" />
        <span data-i18n="enableOfficialArtistLabel">
          Normalize with artist badge
        </span>
      </label>
      <div class="help-text" data-i18n="enableOfficialArtistHelp"></div>
      <label class="checkbox-label">
        <input type="checkbox" id="enableDescriptionMusicMatch" />
        <span data-i18n="enableDescriptionMusicLabel">
          Normalize when music section exists
        </span>
      </label>
      <div class="help-text" data-i18n="enableDescriptionMusicHelp"></div>
      <label class="checkbox-label">
        <input type="checkbox" id="searchInChannel" />
        <span data-i18n="searchInChannelLabel">
          Search in channel name
        </span>
      </label>
      <div class="help-text" data-i18n="searchInChannelHelp"></div>
      <label class="checkbox-label">
        <input type="checkbox" id="enableTitlePatternMatch" />
        <span data-i18n="enableTitlePatternLabel">
          Normalize for title patterns
        </span>
      </label>
      <div class="help-text" data-i18n="enableTitlePatternHelp"></div>
    </div>

    <footer class="footer">
      <a
        href="https://github.com/urmshr/video-speed-normalizer"
        target="_blank"
        rel="noopener noreferrer"
        >GitHub</a
      >
    </footer>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
